<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Option A: Flow graph — 3 nodes connected by directed edges -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <!-- edges -->
  <line x1="9" y1="10" x2="16" y2="16" stroke="#388bfd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="22" x2="16" y2="16" stroke="#388bfd" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="23" y2="16" stroke="#a371f7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- arrowheads -->
  <polyline points="20,13 23,16 20,19" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nodes -->
  <circle cx="9"  cy="10" r="3.5" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <circle cx="9"  cy="22" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="4"   fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <circle cx="23" cy="16" r="3.5" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
</svg>
