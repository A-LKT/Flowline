services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - workflow_data:/app/data
      - ./wa-media:/app/wa-media
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/workflow.db
      PORT: "3001"
      WHATSAPP_BRIDGE_URL: "http://whatsapp-bridge:3002"
      VOICE_TO_TEXT_URL: "http://voice-to-text:9000"
      FILES_INTERNAL_BASE_URL: "http://app:3001"   # URL the VTT container uses to download audio files
      # Register optional services to show their status on the home page.
      # Each entry: { "name", "url", "healthPath" (optional) }
      REGISTERED_SERVICES: '[{"name":"WhatsApp Bridge","url":"http://whatsapp-bridge:3002","healthPath":"/health"}]'
      # Delete finished job runs older than N days (0 or unset = keep forever).
      # RUN_RETENTION_DAYS: "90"
      # Login credential for the single account. REQUIRED — the app refuses to
      # start without a password, so it is never reachable unauthenticated. Prefer
      # AUTH_PASSWORD_HASH (from `npm run auth:hash-password`) over the plaintext.
      AUTH_USERNAME: "${AUTH_USERNAME:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      # AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH}"
      # AUTH_SESSION_TTL_HOURS: "168"
      # Session cookie is marked Secure automatically in production; serve HTTPS.
      # AUTH_COOKIE_SECURE: "true"
      # Allowed cross-origin origins, comma-separated (unset = same-origin only).
      # When set, the session cookie switches to SameSite=None; Secure.
      # CORS_ORIGIN: "https://example.com"
      # Behind a reverse proxy, trust X-Forwarded-For for the real client IP (used
      # for login throttling and logs). true | hop-count | CIDR/IP allowlist.
      # TRUST_PROXY: "true"
    cap_add:
      - NET_RAW   # required for ICMP ping inside the container
    restart: unless-stopped

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - wa_auth:/app/auth
      - ./wa-media:/app/media
    environment:
      AUTH_DIR: /app/auth
      SEND_PORT: "3002"
      WORKFLOW_ENGINE_URL: "${WORKFLOW_ENGINE_URL:-http://app:3001}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"  # must match the secret field on every webhook trigger in the UI
      # ALLOW_FROM: "48511335900,48600123456" # comma-separated phone numbers; leave unset to allow all
    restart: unless-stopped

  voice-to-text:
    build:
      context: ./plugins/voice-to-text
      dockerfile: Dockerfile
    ports:
      - "9000:9000"   # host-run backend reaches the service via this mapping
    volumes:
      - vtt_models:/root/.cache
    environment:
      WHISPER_MODEL:        "${WHISPER_MODEL:-large-v3}"   # GPU can afford the accurate multilingual model
      WHISPER_LANG:         "${WHISPER_LANG:-pl}"          # skip auto-detect for Polish channels
      WHISPER_DEVICE:       "${WHISPER_DEVICE:-cuda}"      # cuda | cpu
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-float16}"
    # GPU passthrough (NVIDIA Container Toolkit / Docker Desktop WSL2 GPU).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  workflow_data:
  wa_auth:
  vtt_models:
